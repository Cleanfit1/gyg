name: Xiaopihai
options:
  bundleIdPrefix: local.personal
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
schemes:
  Xiaopihai:
    build:
      targets:
        Xiaopihai: all
    test:
      targets:
        - XiaopihaiTests
targets:
  Xiaopihai:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.personal.xiaopihai
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 小屁孩
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 录制你主动发送的语音消息
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 在设备支持时仅使用本机语音识别理解消息
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 仅在同一局域网内与自己的电脑同步人物资料和记忆
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: '0.4.0'
        CURRENT_PROJECT_VERSION: '4'
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: '0.4.0'
        CFBundleVersion: '4'
        UIFileSharingEnabled: true
        CFBundleURLTypes:
          - CFBundleURLSchemes: [xiaopihai]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
      - sdk: AVFoundation.framework
      - sdk: Speech.framework
      - sdk: UserNotifications.framework
  XiaopihaiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: [Fixtures]
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
        optional: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Xiaopihai
